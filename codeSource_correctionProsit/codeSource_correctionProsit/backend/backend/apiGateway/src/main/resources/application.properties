spring.application.name=apiGateway


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=CANDITATURE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CANDITATURE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/candidature/**

# Route Candidat through Eureka; Random is configured only for CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].id=CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/candidates/**

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Keep the gateway's Eureka status independent from its registry health indicator
eureka.client.healthcheck.enabled=false

# Information exposed at /actuator/info
info.app.name=apiGateway
info.app.version=0.0.1
info.app.description=API Gateway for the microservices

# Routing and selected-instance diagnostics
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.reactor.netty.http.client=DEBUG
