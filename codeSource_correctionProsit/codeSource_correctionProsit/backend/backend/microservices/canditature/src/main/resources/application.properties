spring.application.name=canditature
server.port=8085

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator endpoints required by the observability workshop
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Publish Actuator health and info links in Eureka
eureka.client.healthcheck.enabled=true
eureka.instance.home-page-url-path=/actuator/info
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

info.app.name=canditature
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidatures
info.app.instance-port=${server.port}
