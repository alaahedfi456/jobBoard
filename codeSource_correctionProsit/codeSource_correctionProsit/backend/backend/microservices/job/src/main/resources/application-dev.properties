spring.datasource.url=jdbc:h2:mem:jobdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Actuator configuration for the observability workshop
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Eureka registration URLs (Actuator paths)
eureka.client.healthcheck.enabled=true
eureka.instance.home-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

info.app.name=job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
